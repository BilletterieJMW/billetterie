<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Billetterie PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:Arial;background:#eef2f7}
.app{padding:14px}

.header{
  background:#0f172a;color:white;border-radius:20px;padding:20px
}

.ticket-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

/* ENTRY CENTER */
#entryButtons{
  display:grid;
  grid-template-columns:repeat(2, minmax(320px,420px));
  justify-content:center;
  gap:24px;
}

.ticket{
  border:none;
  border-radius:16px;
  color:white;
  min-height:115px;
  font-size:24px;
  font-weight:bold;
}

#entryButtons .ticket{
  min-height:140px;
  font-size:30px;
}

.entry{background:#2563eb}
.atelier{background:#7c3aed}

.layout{
  display:grid;
  grid-template-columns:2fr 400px;
  gap:12px;
}

.side{
  background:white;
  border-radius:16px;
  padding:12px;
}

.pay{
  width:100%;
  padding:18px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  color:white;
  font-size:22px;
}

.esp{background:#16a34a}
.cb{background:#f59e0b}

</style>
</head>

<body>

<div class="app">

<div class="header">
  <h1 id="title">Japan Manga Wave</h1>
  <div id="date">2026-04-25</div>
</div>

<br>

<div class="layout">

<div>

<h2>Entrée</h2>
<div id="entryButtons"></div>

<h2>Atelier</h2>
<div id="atelierButtons" class="ticket-grid"></div>

</div>

<div class="side">
  <h2>Panier</h2>
  <div id="cart"></div>

  <h1 id="total">0€</h1>

  <button class="pay esp" onclick="pay('ESP')">ESP</button>
  <button class="pay cb" onclick="pay('CB')">CB</button>
</div>

</div>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://twcgyjhtgxtzaohkzuzg.supabase.co",
  "sb_publishable_Vn8zxLyyMX2OG2NtbCbHKA_8YcQqe1S"
)

let state={
  tickets:{entry:[],atelier:[]},
  cart:[]
}

async function load(){
  const {data}=await supabase
    .from("tickets")
    .select("*")
    .eq("is_active",true)
    .order("sort_order")

  state.tickets.entry=[]
  state.tickets.atelier=[]

  data.forEach(t=>{
    if(t.type==="entry") state.tickets.entry.push(t)
    else state.tickets.atelier.push(t)
  })

  render()
}

function render(){

  document.getElementById("entryButtons").innerHTML =
    state.tickets.entry.map(t=>
      `<button class="ticket entry" onclick="add('${t.id}','entry')">
        ${t.name}<br>${t.price}€
      </button>`
    ).join("")

  document.getElementById("atelierButtons").innerHTML =
    state.tickets.atelier.map(t=>
      `<button class="ticket atelier" onclick="add('${t.id}','atelier')">
        ${t.name}<br>${t.price}€
      </button>`
    ).join("")

  document.getElementById("cart").innerHTML =
    state.cart.map(i=>`${i.name} x${i.qty}<br>`).join("")

  document.getElementById("total").innerText =
    state.cart.reduce((s,i)=>s+i.price*i.qty,0)+"€"
}

function add(id,type){
  const t=state.tickets[type].find(x=>x.id===id)
  const f=state.cart.find(x=>x.id===id)
  if(f) f.qty++
  else state.cart.push({...t,qty:1})
  render()
}

function randomCode(){
  return Math.random().toString(36).substring(2,10).toUpperCase()
}

function buildTicket(item,method){

  return new TextEncoder().encode(
`TICKET
${new Date().toLocaleTimeString("fr-FR")}

${item.name}
${item.price} EUR
${method}

${randomCode()}


`
  )
}

async function connectPrinter(){
  device = await navigator.usb.requestDevice({filters:[{vendorId:0x04b8}]})
  await device.open()
  await device.selectConfiguration(1)
  await device.claimInterface(0)
}

async function send(data){
  await device.transferOut(1,data)
}

async function pay(method){

  for(const item of state.cart){

    for(let i=0;i<item.qty;i++){

      await send(buildTicket(item,method))
    }
  }

  state.cart=[]
  render()
}

load()
</script>

</body>
</html>
