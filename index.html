<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Billetterie JMW</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html,body{margin:0;height:100%;font-family:Arial;background:#eef2f7}
*{box-sizing:border-box}
.app{padding:16px}
.header{background:#0f172a;color:white;border-radius:20px;padding:20px;margin-bottom:14px}
.header h1{margin:0;font-size:38px}
.header p{margin:8px 0 0;font-size:20px;opacity:.8}
.top{display:flex;gap:10px;margin-bottom:14px}
button{border:none;border-radius:14px;padding:18px;font-size:18px;font-weight:700;cursor:pointer}
.connect{background:#111827;color:white}
.status{flex:1;background:white;border-radius:14px;padding:18px}
.layout{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.section{background:white;border-radius:20px;padding:18px;margin-bottom:14px}
.ticket-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ticket{color:white;min-height:90px}
.entry{background:#2563eb}
.atelier{background:#7c3aed}
.cart{background:white;border-radius:20px;padding:18px;display:flex;flex-direction:column;min-height:500px}
.cart-list{flex:1}
.cart-item{border:1px solid #ddd;border-radius:12px;padding:10px;margin-bottom:8px}
.total{background:#0f172a;color:white;border-radius:16px;padding:16px;margin:12px 0}
.total strong{font-size:44px}
.pay{width:100%;color:white;font-size:28px;margin-top:10px}
.esp{background:#16a34a}
.cb{background:#f59e0b}
.clear{background:white;border:1px solid #ddd;width:100%;margin-top:10px}
.admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}
.admin{background:white;border-radius:22px;padding:24px;width:900px;max-height:90vh;overflow:auto}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:8px 0;font-size:17px}
.admin-btn{width:100%;background:#111827;color:white;margin-top:8px}
.green{background:#16a34a}
.red{background:#ef4444}
.row{display:grid;grid-template-columns:1fr 90px 100px;gap:8px;margin-bottom:8px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:14px 22px;border-radius:14px;display:none;font-weight:700}
</style>
</head>

<body>
<div class="app">
  <div class="header" id="adminHold">
    <small>Appuyez longuement ici pour admin</small>
    <h1 id="eventName">Japan Manga Wave</h1>
    <p><span id="eventDate">2026-04-25</span> — <span id="eventLocation">Caen Parc Expo</span></p>
  </div>

  <div class="top">
    <button class="connect" onclick="connectPrinter()">Connecter imprimante USB</button>
    <div class="status" id="status">Chargement...</div>
  </div>

  <div class="layout">
    <div>
      <div class="section">
        <h2>Ticket entrée</h2>
        <div class="ticket-grid" id="entryButtons"></div>
      </div>

      <div class="section">
        <h2>Ticket atelier</h2>
        <div class="ticket-grid" id="atelierButtons"></div>
      </div>
    </div>

    <div class="cart">
      <h2>Panier</h2>
      <div class="cart-list" id="cartList"></div>

      <div class="total">
        <div>Total</div>
        <strong id="total">0€</strong>
      </div>

      <button class="pay esp" onclick="pay('ESP')">ESP</button>
      <button class="pay cb" onclick="pay('CB')">CB</button>
      <button class="clear" onclick="clearCart()">Vider panier</button>
    </div>
  </div>
</div>

<div class="admin-overlay" id="adminOverlay">
  <div class="admin">
    <button class="clear" onclick="closeAdmin()">Fermer</button>

    <h2>Paramètres événement</h2>
    <input id="adminEventName" placeholder="Nom événement">
    <input id="adminEventDate" placeholder="Date">
    <input id="adminEventLocation" placeholder="Lieu">
    <button class="admin-btn green" onclick="saveEvent()">Sauvegarder événement</button>

    <h2>Créer billet</h2>
    <input id="newName" placeholder="Nom du billet">
    <input id="newPrice" placeholder="Prix">
    <select id="newType">
      <option value="entry">Entrée</option>
      <option value="atelier">Atelier</option>
    </select>
    <button class="admin-btn green" onclick="createTicket()">Ajouter billet</button>

    <h2>Billets entrée</h2>
    <div id="adminEntry"></div>

    <h2>Billets atelier</h2>
    <div id="adminAtelier"></div>
  </div>
</div>

<div class="toast" id="toast">OK</div>

<script>
const SUPABASE_URL = "https://twcgyjhtgxtzaohkzuzg.supabase.co";
const SUPABASE_KEY = "sb_publishable_Vn8zxLyyMX2OG2NtbCbHKA_8YcQqe1S";
const ADMIN_CODE = "2026";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let device = null;
let endpoint = null;
let iface = null;
let holdTimer = null;

let state = {
  event:{name:"Japan Manga Wave",date:"2026-04-25",location:"Caen Parc Expo"},
  tickets:{entry:[],atelier:[]},
  cart:[]
};

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1200);
}

function setStatus(msg){
  document.getElementById("status").textContent=msg;
}

async function loadData(){
  setStatus("Chargement Supabase...");

  try{
    const eventRes = await sb.from("event_settings").select("*").eq("id","main").single();

    if(!eventRes.error && eventRes.data){
      state.event = {
        name:eventRes.data.name,
        date:eventRes.data.event_date,
        location:eventRes.data.location
      };
    }

    const ticketRes = await sb
      .from("tickets")
      .select("*")
      .eq("is_active",true)
      .order("type",{ascending:true})
      .order("sort_order",{ascending:true});

    if(ticketRes.error){
      alert("Erreur Supabase tickets: " + ticketRes.error.message);
      console.error(ticketRes.error);
      return;
    }

    const data = ticketRes.data || [];

    state.tickets.entry = data
      .filter(t=>t.type==="entry")
      .map(t=>({id:t.id,name:t.name,price:Number(t.price),type:"Entree",dbType:"entry"}));

    state.tickets.atelier = data
      .filter(t=>t.type==="atelier")
      .map(t=>({id:t.id,name:t.name,price:Number(t.price),type:"Atelier",dbType:"atelier"}));

    setStatus("Supabase OK · " + data.length + " billets chargés");
    render();

  }catch(e){
    alert("Erreur JS loadData: " + e.message);
    console.error(e);
  }
}

function render(){
  document.getElementById("eventName").textContent = state.event.name;
  document.getElementById("eventDate").textContent = state.event.date;
  document.getElementById("eventLocation").textContent = state.event.location;

  document.getElementById("entryButtons").innerHTML =
    state.tickets.entry.map(t=>`
      <button class="ticket entry" onclick="addToCart('${t.id}','entry')">
        ${t.name}<br>${t.price}€
      </button>
    `).join("");

  document.getElementById("atelierButtons").innerHTML =
    state.tickets.atelier.map(t=>`
      <button class="ticket atelier" onclick="addToCart('${t.id}','atelier')">
        ${t.name}<br>${t.price}€
      </button>
    `).join("");

  document.getElementById("cartList").innerHTML =
    state.cart.map((i,index)=>`
      <div class="cart-item">
        <b>${i.name}</b><br>
        ${i.price}€ x ${i.qty} = ${i.price*i.qty}€
        <br>
        <button onclick="changeQty(${index},-1)">-</button>
        <button onclick="changeQty(${index},1)">+</button>
      </div>
    `).join("") || "Aucun billet";

  document.getElementById("total").textContent = total()+"€";
  renderAdminTickets();
}

function addToCart(id,kind){
  const t = state.tickets[kind].find(x=>x.id===id);
  if(!t) return;

  const found = state.cart.find(x=>x.id===id);
  if(found) found.qty++;
  else state.cart.push({...t,qty:1});

  render();
}

function changeQty(index,delta){
  state.cart[index].qty += delta;
  if(state.cart[index].qty<=0) state.cart.splice(index,1);
  render();
}

function clearCart(){
  state.cart=[];
  render();
}

function total(){
  return state.cart.reduce((s,i)=>s+i.price*i.qty,0);
}

function clean(v){
  return String(v)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/€/g," EUR")
    .replace(/[^\x20-\x7E\n]/g,"");
}

function txt(v){
  return new TextEncoder().encode(clean(v));
}

function cmd(...b){
  return new Uint8Array(b);
}

function concat(arrays){
  let total=arrays.reduce((s,a)=>s+a.length,0);
  let out=new Uint8Array(total);
  let offset=0;
  arrays.forEach(a=>{
    out.set(a,offset);
    offset+=a.length;
  });
  return out;
}

async function connectPrinter(){
  try{
    device = await navigator.usb.requestDevice({filters:[{vendorId:0x04b8}]});
    await device.open();

    if(!device.configuration){
      await device.selectConfiguration(1);
    }

    endpoint=null;
    iface=null;

    for(const i of device.configuration.interfaces){
      for(const alt of i.alternates){
        const ep=alt.endpoints.find(e=>e.direction==="out");
        if(ep){
          iface=i.interfaceNumber;
          endpoint=ep.endpointNumber;
          break;
        }
      }
      if(endpoint) break;
    }

    await device.claimInterface(iface);
    setStatus("Imprimante connectée: " + device.productName);
    toast("Imprimante connectée");
  }catch(e){
    setStatus("Erreur imprimante: " + e.message);
  }
}

function saleNumber(){
  const d=new Date();
  return "V"+String(d.getFullYear()).slice(2)
    +String(d.getMonth()+1).padStart(2,"0")
    +String(d.getDate()).padStart(2,"0")
    +"-"+Math.floor(1000+Math.random()*9000);
}

function randomCode(prefix){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out=prefix+"-";
  for(let i=0;i<8;i++){
    out+=chars[Math.floor(Math.random()*chars.length)];
  }
  return out;
}

function buildTicket(item,method,saleId,code){
  return concat([
    cmd(0x1B,0x40),
    cmd(0x1B,0x61,0x01),
    cmd(0x1B,0x45,0x01),
    cmd(0x1D,0x21,0x11),
    txt("TICKET\n"),
    cmd(0x1D,0x21,0x00),
    cmd(0x1B,0x45,0x00),
    txt(state.event.name+"\n"),
    txt(state.event.date+"\n"),
    txt(state.event.location+"\n"),
    txt("------------------------------\n"),
    txt(item.name+"\n"),
    txt("Type: "+item.type+"\n"),
    txt("Prix: "+item.price+" EUR\n"),
    txt("Paiement: "+method+"\n"),
    txt("Vente: "+saleId+"\n"),
    txt("Code: "+code+"\n"),
    txt("------------------------------\n"),
    cmd(0x1D,0x21,0x11),
    txt(code+"\n"),
    cmd(0x1D,0x21,0x00),
    txt("1 billet = 1 ticket\n"),
    txt("\n\n\n\n"),
    cmd(0x1D,0x56,0x42,0x00)
  ]);
}

async function sendTicket(item,method,saleId){
  if(!device){
    alert("Connectez d'abord l'imprimante USB");
    return false;
  }

  const code=randomCode(item.type==="Entree"?"ENT":"ATL");
  const data=buildTicket(item,method,saleId,code);

  try{
    await device.transferOut(endpoint,data);
    return true;
  }catch(e){
    alert("Erreur impression: "+e.message);
    return false;
  }
}

async function pay(method){
  if(state.cart.length===0){
    alert("Panier vide");
    return;
  }

  const saleId=saleNumber();
  const saleItems=JSON.parse(JSON.stringify(state.cart));
  const saleTotal=total();

  for(const item of state.cart){
    for(let i=0;i<item.qty;i++){
      const ok=await sendTicket(item,method,saleId);
      if(!ok) return;
      await new Promise(r=>setTimeout(r,150));
    }
  }

  await saveSale(saleId,method,saleTotal,saleItems);

  state.cart=[];
  render();
  toast("Vente imprimée");
}

async function saveSale(saleId,method,totalAmount,items){
  const saleRes = await sb.from("sales").insert({
    id:saleId,
    payment_method:method,
    total:totalAmount
  });

  if(saleRes.error){
    console.error(saleRes.error);
    alert("Vente imprimée mais non sauvegardée: "+saleRes.error.message);
    return;
  }

  const rows=items.map(i=>({
    sale_id:saleId,
    ticket_id:i.id,
    ticket_name:i.name,
    ticket_type:i.type,
    price:i.price,
    quantity:i.qty
  }));

  const itemRes = await sb.from("sale_items").insert(rows);

  if(itemRes.error){
    console.error(itemRes.error);
    alert("Erreur sauvegarde détails: "+itemRes.error.message);
  }
}

function openAdmin(){
  const code=prompt("Code admin");
  if(code!==ADMIN_CODE) return;

  document.getElementById("adminEventName").value=state.event.name;
  document.getElementById("adminEventDate").value=state.event.date;
  document.getElementById("adminEventLocation").value=state.event.location;

  document.getElementById("adminOverlay").style.display="flex";
}

function closeAdmin(){
  document.getElementById("adminOverlay").style.display="none";
}

async function saveEvent(){
  const name=document.getElementById("adminEventName").value;
  const event_date=document.getElementById("adminEventDate").value;
  const location=document.getElementById("adminEventLocation").value;

  const res=await sb.from("event_settings").upsert({
    id:"main",
    name,
    event_date,
    location,
    updated_at:new Date().toISOString()
  });

  if(res.error){
    alert("Erreur event: "+res.error.message);
    return;
  }

  await loadData();
  toast("Événement sauvegardé");
}

async function createTicket(){
  const name=document.getElementById("newName").value.trim();
  const price=Number(document.getElementById("newPrice").value);
  const type=document.getElementById("newType").value;

  if(!name || !price){
    alert("Nom ou prix manquant");
    return;
  }

  const res=await sb.from("tickets").insert({
    name,
    price,
    type,
    is_active:true,
    sort_order:99
  });

  if(res.error){
    alert("Erreur création: "+res.error.message);
    return;
  }

  document.getElementById("newName").value="";
  document.getElementById("newPrice").value="";

  await loadData();
  toast("Billet ajouté");
}

function renderAdminTickets(){
  document.getElementById("adminEntry").innerHTML =
    state.tickets.entry.map(t=>`
      <div class="row">
        <input value="${t.name}" onchange="updateTicket('${t.id}','name',this.value)">
        <input value="${t.price}" onchange="updateTicket('${t.id}','price',this.value)">
        <button class="admin-btn red" onclick="deleteTicket('${t.id}')">Suppr.</button>
      </div>
    `).join("");

  document.getElementById("adminAtelier").innerHTML =
    state.tickets.atelier.map(t=>`
      <div class="row">
        <input value="${t.name}" onchange="updateTicket('${t.id}','name',this.value)">
        <input value="${t.price}" onchange="updateTicket('${t.id}','price',this.value)">
        <button class="admin-btn red" onclick="deleteTicket('${t.id}')">Suppr.</button>
      </div>
    `).join("");
}

async function updateTicket(id,field,value){
  const patch={};
  patch[field]=field==="price"?Number(value):value;

  const res=await sb.from("tickets").update(patch).eq("id",id);

  if(res.error){
    alert("Erreur update: "+res.error.message);
    return;
  }

  await loadData();
  toast("Billet modifié");
}

async function deleteTicket(id){
  const res=await sb.from("tickets").update({is_active:false}).eq("id",id);

  if(res.error){
    alert("Erreur suppression: "+res.error.message);
    return;
  }

  await loadData();
  toast("Billet supprimé");
}

document.getElementById("adminHold").addEventListener("mousedown",()=>{
  holdTimer=setTimeout(openAdmin,1000);
});
document.getElementById("adminHold").addEventListener("mouseup",()=>{
  clearTimeout(holdTimer);
});
document.getElementById("adminHold").addEventListener("mouseleave",()=>{
  clearTimeout(holdTimer);
});
document.getElementById("adminHold").addEventListener("touchstart",()=>{
  holdTimer=setTimeout(openAdmin,1000);
});
document.getElementById("adminHold").addEventListener("touchend",()=>{
  clearTimeout(holdTimer);
});

loadData();
</script>
</body>
</html>
