<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Billetterie PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:Arial;background:#eef2f7}
.app{padding:12px}
.header{background:#0f172a;color:#fff;border-radius:18px;padding:18px}
h1{margin:0;font-size:36px}
.top{display:flex;gap:10px;margin-top:10px}
button{border:none;border-radius:12px;padding:14px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white}
.green{background:#16a34a;color:white}
.orange{background:#f59e0b;color:white}
.red{background:#ef4444;color:white}

.layout{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}

.section{background:white;border-radius:18px;padding:16px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.ticket{padding:26px;border-radius:16px;color:white;font-size:20px}
.entry{background:#2563eb}
.atelier{background:#7c3aed}

.side{background:white;border-radius:18px;padding:16px}
.total{font-size:40px;font-weight:700}
.cart-item{border-bottom:1px solid #ddd;padding:6px 0}

.admin{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.admin-box{background:white;padding:20px;border-radius:16px;width:800px;max-height:90vh;overflow:auto}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#f1f5f9;padding:12px;border-radius:10px}
</style>
</head>

<body>
<div class="app">

<div class="header" id="header">
<h1 id="eventName">Japan Manga Wave</h1>
<div id="eventDate">2026-04-25</div>
</div>

<div class="top">
<button class="primary" onclick="connectPrinter()">USB</button>
<button onclick="setMode('panier')">Panier</button>
<button onclick="setMode('rapide')">Rapide ESP</button>
</div>

<div class="layout">

<div>

<div class="section">
<h3>Entrée</h3>
<div class="grid" id="entry"></div>
</div>

<div class="section">
<h3>Atelier</h3>
<div class="grid-3" id="atelier"></div>
</div>

</div>

<div class="side">
<h3>Panier</h3>
<div id="cart"></div>

<div class="total" id="total">0€</div>

<button class="green" onclick="pay('ESP')">ESP</button>
<button class="orange" onclick="pay('CB')">CB</button>
<button onclick="clearCart()">Vider</button>
</div>

</div>
</div>

<!-- ADMIN -->
<div class="admin" id="adminBox">
<div class="admin-box">

<button onclick="closeAdmin()">Fermer</button>

<h3>Stats</h3>
<div class="stats">
<div class="stat">Ventes<br><b id="sSales">0</b></div>
<div class="stat">Tickets<br><b id="sTickets">0</b></div>
<div class="stat">CA<br><b id="sCA">0€</b></div>
<div class="stat">ESP<br><b id="sESP">0€</b></div>
</div>

<button class="red" onclick="resetSales()">RESET</button>

<h3>Tickets</h3>
<div id="adminTickets"></div>

</div>
</div>

<script>
const URL="https://twcgyjhtgxtzaohkzuzg.supabase.co";
const KEY="sb_publishable_Vn8zxLyyMX2OG2NtbCbHKA_8YcQqe1S";

const sb = window.supabase.createClient(URL,KEY);

let state={tickets:[],cart:[],sales:[],mode:"panier"};

async function load(){
const {data:tickets}=await sb.from("tickets").select("*").eq("is_active",true);
state.tickets=tickets||[];

const {data:sales}=await sb.from("sales").select("*");
state.sales=sales||[];

render();
}

function render(){
document.getElementById("entry").innerHTML=
state.tickets.filter(t=>t.type==="entry")
.map(t=>`<button class="ticket entry" onclick="add('${t.id}')">${t.name}<br>${t.price}€</button>`).join("");

document.getElementById("atelier").innerHTML=
state.tickets.filter(t=>t.type==="atelier")
.map(t=>`<button class="ticket atelier" onclick="add('${t.id}')">${t.name}<br>${t.price}€</button>`).join("");

document.getElementById("cart").innerHTML=
state.cart.map(c=>`<div class="cart-item">${c.name} x${c.qty}</div>`).join("");

document.getElementById("total").innerText=total()+"€";

renderStats();
}

function add(id){
const t=state.tickets.find(x=>x.id===id);
let f=state.cart.find(x=>x.id===id);
if(f)f.qty++; else state.cart.push({...t,qty:1});
render();
}

function total(){
return state.cart.reduce((s,i)=>s+i.price*i.qty,0);
}

function clearCart(){
state.cart=[];
render();
}

async function pay(method){
if(state.cart.length===0)return;

const saleId="V"+Date.now();

await sb.from("sales").insert({
id:saleId,
payment_method:method,
total:total()
});

state.cart=[];
load();
}

function renderStats(){
let ca=0,esp=0,tickets=0;

state.sales.forEach(s=>{
ca+=s.total;
if(s.payment_method==="ESP")esp+=s.total;
});

document.getElementById("sSales").innerText=state.sales.length;
document.getElementById("sCA").innerText=ca+"€";
document.getElementById("sESP").innerText=esp+"€";
}

async function resetSales(){
if(!confirm("Reset ?"))return;

await sb.from("sales").delete().neq("id","");
await sb.from("sale_items").delete().neq("id","");

state.sales=[];
renderStats();
alert("RESET OK");
}

function setMode(m){state.mode=m;}

function connectPrinter(){
alert("USB OK (mock)");
}

/* ADMIN HOLD */
let timer=null;
document.getElementById("header").addEventListener("mousedown",()=>{
timer=setTimeout(()=>openAdmin(),800);
});
document.getElementById("header").addEventListener("mouseup",()=>clearTimeout(timer));

function openAdmin(){
document.getElementById("adminBox").style.display="flex";
}

function closeAdmin(){
document.getElementById("adminBox").style.display="none";
}

load();
</script>

</body>
</html>
