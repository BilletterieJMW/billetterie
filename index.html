<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Billetterie POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html,body{margin:0;height:100%;font-family:Arial;background:#eef2f7}
.app{padding:16px}
.header{background:#0f172a;color:white;border-radius:20px;padding:20px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:12px}
.section{background:white;padding:16px;border-radius:20px;margin-bottom:12px}
button{border:none;border-radius:12px;padding:16px;font-size:18px;font-weight:700}
.entry{background:#2563eb;color:white}
.atelier{background:#7c3aed;color:white}
.pay{width:100%;margin-top:10px;color:white;font-size:22px}
.esp{background:#16a34a}
.cb{background:#f59e0b}
.cart{background:white;padding:16px;border-radius:20px}
.total{font-size:40px;font-weight:700}
</style>
</head>

<body>
<div class="app">

<div class="header" id="adminHold">
  <div id="eventName">Japan Manga Wave</div>
  <div id="eventDate">2026-04-25</div>
</div>

<div class="grid">

<div>

<div class="section">
<h3>Entrée</h3>
<div id="entry"></div>
</div>

<div class="section">
<h3>Atelier</h3>
<div id="atelier"></div>
</div>

</div>

<div class="cart">
<h3>Panier</h3>
<div id="cart"></div>

<div class="total" id="total">0€</div>

<button class="pay esp" onclick="pay('ESP')">ESP</button>
<button class="pay cb" onclick="pay('CB')">CB</button>

</div>

</div>
</div>

<script>
const SUPABASE_URL = "https://twcgyjhtgxtzaohkzuzg.supabase.co";
const SUPABASE_KEY = "sb_publishable_Vn8zxLyyMX2OG2NtbCbHKA_8YcQqe1S";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  tickets: {entry:[], atelier:[]},
  cart:[]
};

async function load(){
  const { data } = await supabase.from("tickets").select("*").eq("is_active",true);

  state.tickets.entry = data.filter(t=>t.type==="entry");
  state.tickets.atelier = data.filter(t=>t.type==="atelier");

  render();
}

function render(){
  document.getElementById("entry").innerHTML =
    state.tickets.entry.map(t =>
      `<button class="entry" onclick="add('${t.id}')">${t.name}<br>${t.price}€</button>`
    ).join("");

  document.getElementById("atelier").innerHTML =
    state.tickets.atelier.map(t =>
      `<button class="atelier" onclick="add('${t.id}')">${t.name}<br>${t.price}€</button>`
    ).join("");

  document.getElementById("cart").innerHTML =
    state.cart.map(i =>
      `<div>${i.name} x${i.qty} = ${i.price*i.qty}€</div>`
    ).join("");

  document.getElementById("total").innerText = total()+"€";
}

function add(id){
  const t = [...state.tickets.entry, ...state.tickets.atelier].find(x=>x.id==id);

  let found = state.cart.find(i=>i.id==id);
  if(found) found.qty++;
  else state.cart.push({...t, qty:1});

  render();
}

function total(){
  return state.cart.reduce((s,i)=>s+i.price*i.qty,0);
}

function pay(method){
  if(state.cart.length===0){
    alert("Panier vide");
    return;
  }

  alert("Paiement "+method+" OK");

  state.cart=[];
  render();
}

load();
</script>

</body>
</html>
